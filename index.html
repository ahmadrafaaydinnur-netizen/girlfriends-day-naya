<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Girlfriend Day, Denaya!</title>
    <style>
        /* Mengambil font yang cantik dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #ffe6f0; /* Warna latar belakang pink pastel */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.6);
            text-align: center;
            max-width: 90%;
            width: 400px;
            z-index: 10;
            border: 2px solid #ffb6c1;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d81b60;
            font-size: 2.8rem;
            margin-bottom: 5px;
            margin-top: 0;
        }

        .date {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        p {
            color: #555;
            line-height: 1.6;
            font-size: 1.1rem;
            margin: 10px 0;
        }

        .name {
            font-weight: 600;
            color: #d81b60;
            font-size: 1.4rem;
            background: #ffe6f0;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            margin: 10px 0;
        }

        /* Animasi Bunga Jatuh */
        .flower {
            position: absolute;
            top: -10%;
            user-select: none;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Girlfriend Day!</h1>
        <div class="date">1 Agustus 2026</div>
        <p>Teruntuk wanita yang paling spesial,</p>
        <div class="name">Denaya Hana Almira 🌸</div>
        <p>Terima kasih sudah menjadi alasan di balik setiap senyumku. Semoga hari-harimu selalu seindah dan secerah bunga-bunga ini. I love you!</p>
    </div>

    <script>
        // Script untuk membuat efek bunga berjatuhan
        function createFlower() {
            const flowers = ['🌸', '🌺', '🌷', '🌻', '🌼', '🌹'];
            const flower = document.createElement('div');
            flower.classList.add('flower');
            
            // Memilih jenis bunga secara acak
            flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            
            // Menentukan posisi horizontal, ukuran, dan kecepatan jatuh secara acak
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = Math.random() * 3 + 4 + 's'; // Antara 4 hingga 7 detik
            flower.style.fontSize = Math.random() * 15 + 15 + 'px'; // Antara 15px hingga 30px
            
            document.body.appendChild(flower);

            // Menghapus bunga setelah melewati layar agar tidak memberatkan browser
            setTimeout(() => {
                flower.remove();
            }, 7000);
        }

        // Memunculkan bunga baru setiap 300 milidetik
        setInterval(createFlower, 300);
    </script>
</body>
</html>
